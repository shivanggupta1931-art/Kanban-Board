<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <div class="left">Kanban Board</div>
            <div class="right"><button id="toggle-modal">Add new task</button>
                <button id="theme-toggle">🌙</button>
            </div>
        </nav>



        <!-- PROGRESS TAB -->
        <div class="stats">
    <div>Total Tasks: <span id="total-tasks">0</span></div>
    <div>Completed: <span id="completed-tasks">0</span></div>
    <div>In Progress: <span id="progress-tasks">0</span></div>
    <div>Pending: <span id="pending-tasks">0</span></div>
    <div>Completion Rate: <span id="completion-rate">0%</span></div>
    </div>
    <!-- PROGRESS TAB -->



        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>
                <!-- <div draggable="true" class="task">
                    <h2>Task 1 </h2>
                    <p>Description</p>
                    <button>Delete</button>
                </div> -->
            </div>
            <div id="progress" class="task-column ">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>
                </div>
            </div>
            <div id="done" class="task-column ">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>


    <div class="modal add-mew-task">
        <div class="bg"></div>
        <div class="center">
            <input type="text"
                 id="task-title-input"
                placeholder="Task Title">
            <textarea 
            id="task-desc-input"
            placeholder="Task Description"></textarea>
                <select id="task-priority">
                <option value="low">🟢 Low</option>
                <option value="medium">🟡 Medium</option>
                <option value="high">🔴 High</option>
                </select>
            <button id="add-new-task" class="add-task-btn">Add Task</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
